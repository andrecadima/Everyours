services:
  db:
    image: postgres:17-alpine
    container_name: everyours-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: everyours
      POSTGRES_PASSWORD: everyours
      POSTGRES_DB: everyours
    ports:
      - "5433:5432"
    volumes:
      - everyours-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everyours -d everyours"]
      interval: 2s
      timeout: 3s
      retries: 30
